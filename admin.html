<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="top"><strong>ABSENSI KELAS</strong><button id="logout" class="btn danger small">Logout</button></header>
<main class="container"><h1>DASHBOARD ADMIN</h1><p>Selamat datang, <b>Faiz</b>.</p>
<section class="stats"><div><b id="total">0</b><span>TOTAL SISWA</span></div><div><b id="hadir">0</b><span>HADIR</span></div><div><b id="izin">0</b><span>IZIN</span></div><div><b id="sakit">0</b><span>SAKIT</span></div><div><b id="alpa">0</b><span>ALPA</span></div><div><b id="belum">0</b><span>BELUM ABSEN</span></div></section>
<section class="card"><h2>Buat QR Absensi</h2><label>Kelas<input id="kelas" value="RPL"></label><label>Durasi<select id="durasi"><option value="5">5 menit</option><option value="10" selected>10 menit</option><option value="15">15 menit</option></select></label><button id="create" class="btn primary">BUAT QR ABSENSI</button><div id="qr"></div><p id="timer"></p><button id="close" class="btn danger hidden">TUTUP SESI</button></section>
<section class="card"><h2>Data Absensi</h2><input id="search" placeholder="Cari nama..."><select id="filter"><option>SEMUA</option><option>HADIR</option><option>IZIN</option><option>SAKIT</option><option>ALPA</option></select><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kelas</th><th>NIS</th><th>Status</th><th>Waktu</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script type="module" src="js/admin.js"></script></body></html>
